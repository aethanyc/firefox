<!DOCTYPE html>
<meta charset="utf-8">
<title>Anchoring to a sticky anchor does not extend the scroll range</title>
<link rel="author" title="Ting-Yu Lin" href="mailto:tlin@mozilla.com">
<link rel="help" href="https://drafts.csswg.org/css-anchor-position-1/#scroll">
<link rel="help" href="https://bugzilla.mozilla.org/show_bug.cgi?id=2072683">
<meta name="assert" content="Scrolling a scroll container must not keep
    extending its scroll range when it contains a sticky anchor and a
    positioned element anchored to it that is taller than the scrollport.">
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>

<style>
#scroller {
  position: relative;
  width: 700px;
  height: 600px;
  overflow-y: auto;
  border: 1px solid #888;
  box-sizing: border-box;
}
#sticky {
  position: sticky;
  top: 0px;
  height: 10px;
  width: 10px;
  background: purple;
  anchor-name: --foo;
}
#content {
  height: 1800px;
}
/* Taller than the scrollport, so that following the sticky anchor can push it
   past the bottom of the content and grow the scrollable overflow. */
#thumb {
  position: absolute;
  position-anchor: --foo;
  position-area: bottom right;
  width: 16px;
  height: 800px;
  background: grey;
}
</style>

<div id="scroller">
  <div id="sticky"></div>
  <div id="content"></div>
  <div id="thumb"></div>
</div>

<script>
const frames = n => new Promise(resolve => {
  const tick = () => (--n <= 0) ? resolve() : requestAnimationFrame(tick);
  requestAnimationFrame(tick);
});

promise_test(async () => {
  const scroller = document.getElementById("scroller");
  let previous = -1;
  for (let i = 0; i < 10; i++) {
    scroller.scrollTop = scroller.scrollHeight;
    // The scroll shift is applied off a refresh tick rather than synchronously
    // from the scrollTop setter, so let it settle before measuring.
    await frames(2);
    const height = scroller.scrollHeight;
    if (height === previous) {
      return;
    }
    previous = height;
  }
  assert_unreached(`scrollHeight kept growing, reached ${previous}`);
}, "Scrolling to the bottom does not extend the scroll range");
</script>
