<!DOCTYPE html>
<meta charset="utf-8">
<title>CSS Anchor Positioning Test: Resolve anchor() when the anchor element is IB-split</title>
<link rel="author" title="Ting-Yu Lin" href="mailto:tlin@mozilla.com">
<link rel="author" title="Mozilla" href="https://www.mozilla.org/">
<link rel="help" href="https://drafts.csswg.org/css-anchor-position-1/#anchor-resolution">
<link rel="help" href="https://bugzilla.mozilla.org/show_bug.cgi?id=2063785">
<link rel="match" href="anchor-position-inline-008-ref.html">
<link rel="stylesheet" href="/fonts/ahem.css">

<style>
.rel {
  position: relative;
  background: lightgray;
}

.anchor {
  anchor-name: --a;
}

.target {
  position: absolute;
  left: anchor(--a left);
  right: anchor(--a right);
  top: anchor(--a top);
  bottom: anchor(--a bottom);
  background: green;
}
</style>

<div style="font: 20px/1 Ahem; width: 11em">
  <div class="rel">Lorem ipsum
    <span class="anchor">dolor<div style="width: 6em; background: gold">sit</div>amet</span>
    <span class="target"></span>
  </div>
</div>
