<!DOCTYPE html>
<html class="reftest-wait">
<title>Anchor in scroller inside scaled element inside another scroller, scrolled after layout, anchored element on the outside</title>
<link rel="author" title="Ting-Yu Lin" href="mailto:tlin@mozilla.com">
<link rel="help" href="https://drafts.csswg.org/css-anchor-position-1/#scroll">
<link rel="match" href="../reference/ref-filled-green-100px-square.xht">
<script src="/common/rendering-utils.js"></script>
<style>
  #outer {
    overflow: hidden;
    width: 100px;
    height: 100px;
  }

  #wrapper {
    width: 50px;
    transform-origin: top left;
    transform: scale(2);
  }

  #inner {
    overflow: hidden;
    width: 50px;
    height: 50px;
  }

  #anchor {
    anchor-name: --foo;
    width: 25px;
    height: 50px;
    background: green;
  }

  #positioned {
    position: absolute;
    position-anchor: --foo;
    position-area: right;
    width: 50px;
    height: 100px;
    background: green;
  }
</style>
<p>Test passes if there is a filled green square and <strong>no red</strong>.</p>
<div style="width: 100px; height: 100px; background: red;">
  <div id="outer">
    <div style="height: 100px;"></div>
    <div id="wrapper">
      <div id="inner">
        <div style="height: 150px;"></div>
        <div id="anchor"></div>
        <div style="height: 1000px;"></div>
      </div>
    </div>
    <div style="height: 1000px;"></div>
  </div>
  <div id="positioned"></div>
</div>
<script>
  waitForAtLeastOneFrame().then(() => {
    outer.scrollTop = 100;
    inner.scrollTop = 150;
    document.documentElement.classList.remove("reftest-wait");
  });
</script>
</html>
