<!DOCTYPE html>
<title>CSS Overflow Reference: Text in a fixed-pos element at the right edge is painted completely with scrollbar-gutter on both edges</title>
<link rel="author" title="Ting-Yu Lin" href="mailto:tlin@mozilla.com">
<link rel="author" title="Mozilla" href="https://www.mozilla.org/">
<style>
:root {
  scrollbar-gutter: stable both-edges;
}
.box {
  position: absolute;
  top: 0;
  right: 0;
  border: 1px solid black;
}
</style>

<div class="box">At top-right corner</div>
