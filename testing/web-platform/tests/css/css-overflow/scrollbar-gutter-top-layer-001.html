<!DOCTYPE html>
<title>CSS Overflow Test: Top layer ::backdrop covers the root element's scrollbar-gutter</title>
<link rel="author" title="Ting-Yu Lin" href="mailto:tlin@mozilla.com">
<link rel="author" title="Mozilla" href="https://www.mozilla.org/">
<link rel="help" href="https://drafts.csswg.org/css-overflow-3/#scrollbar-gutter-property">
<link rel="help" href="https://github.com/w3c/csswg-drafts/issues/9904">
<link rel="match" href="/css/reference/green.html">

<style>
:root {
  scrollbar-gutter: stable;
  background: red;
}
dialog {
  border: none;
  padding: 0;
  background: transparent;
  outline: none;
}
dialog::backdrop {
  background: green;
}
</style>

<dialog id="dialog"></dialog>
<script>
dialog.showModal();
</script>
