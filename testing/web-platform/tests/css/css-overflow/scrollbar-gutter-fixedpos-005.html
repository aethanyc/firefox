<!DOCTYPE html>
<title>CSS Overflow Test: Text in a fixed-pos element at the right edge is painted completely with scrollbar-gutter on both edges</title>
<link rel="author" title="Ting-Yu Lin" href="mailto:tlin@mozilla.com">
<link rel="author" title="Mozilla" href="https://www.mozilla.org/">
<link rel="help" href="https://drafts.csswg.org/css-overflow-3/#scrollbar-gutter-property">
<link rel="match" href="scrollbar-gutter-fixedpos-005-ref.html">
<style>
:root {
  scrollbar-gutter: stable both-edges;
}
.box {
  position: fixed;
  top: 0;
  right: 0;
  border: 1px solid black;
}
</style>

<div class="box">At top-right corner</div>
