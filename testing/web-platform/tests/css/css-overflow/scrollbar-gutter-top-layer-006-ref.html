<!DOCTYPE html>
<title>CSS Overflow Reference: Top layer position:absolute modal dialog doesn't cover the root element's scrollbar-gutter</title>
<link rel="author" title="Ting-Yu Lin" href="mailto:tlin@mozilla.com">
<link rel="author" title="Mozilla" href="https://www.mozilla.org/">

<style>
:root {
  scrollbar-gutter: stable both-edges;
}
dialog {
  position: absolute;
  inset: 0 0 auto auto;
  outline: none;
}
</style>

<dialog id="dialog">At top-right corner</dialog>
<script>
dialog.show(); /* Use non-modal dialog */
</script>
