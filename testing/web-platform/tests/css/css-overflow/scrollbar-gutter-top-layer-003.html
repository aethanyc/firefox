<!DOCTYPE html>
<title>CSS Overflow Test: Top layer popover covers the root element's scrollbar-gutter</title>
<link rel="author" title="Ting-Yu Lin" href="mailto:tlin@mozilla.com">
<link rel="author" title="Mozilla" href="https://www.mozilla.org/">
<link rel="help" href="https://drafts.csswg.org/css-overflow-3/#scrollbar-gutter-property">
<link rel="help" href="https://github.com/w3c/csswg-drafts/issues/9904">
<link rel="match" href="scrollbar-gutter-top-layer-001-ref.html">
<style>
:root {
  scrollbar-gutter: stable both-edges;
  background: red;
}
#popover {
  inset: 0;
  margin: 0;
  width: auto;
  height: auto;
  border: none;
  padding: 0;
  background: green;
}
</style>

<div id="popover" popover></div>
<script>
popover.showPopover();
</script>
