<!doctype html>
<html class="reftest-wait">
<meta charset="utf-8">
<title>Fullscreen elements cover the root scrollbar gutters</title>
<link rel="help" href="https://fullscreen.spec.whatwg.org/#:fullscreen-pseudo-class">
<link rel="match" href="fullscreen-scrollbar-gutter-ref.html">
<style>
  html {
    scrollbar-gutter: stable both-edges;
    overflow: hidden;
    background: red;
  }
  #target { background: green; }
  #target::before, #target::after {
    content: "";
    position: absolute;
    top: 0;
    bottom: 0;
    width: 8px;
    background: white;
  }
  #target::before { left: 0; }
  #target::after { right: 0; }
</style>
<div id="target"></div>
<script src="/resources/testdriver.js"></script>
<script src="/resources/testdriver-vendor.js"></script>
<script>
  test_driver.bless("fullscreen", () => document.querySelector("#target").requestFullscreen())
    .then(() => document.documentElement.classList.remove("reftest-wait"));
</script>
