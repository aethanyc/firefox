<!doctype html>
<html class="reftest-wait">
<meta charset="utf-8">
<title>Fullscreen backdrops cover the root scrollbar gutters</title>
<link rel="help" href="https://fullscreen.spec.whatwg.org/#::backdrop-pseudo-element">
<link rel="match" href="fullscreen-scrollbar-gutter-ref.html">
<style>
  html {
    scrollbar-gutter: stable both-edges;
    overflow: hidden;
    background: red;
  }
  #target::backdrop {
    background: green;
    border-left: 8px solid white;
    border-right: 8px solid white;
  }
</style>
<div id="target"></div>
<script src="/resources/testdriver.js"></script>
<script src="/resources/testdriver-vendor.js"></script>
<script>
  test_driver.bless("fullscreen", () => document.querySelector("#target").requestFullscreen())
    .then(() => document.documentElement.classList.remove("reftest-wait"));
</script>
